spring.application.name=song-service
server.port=8082

# Defaults for local execution; Compose overrides them with environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/song-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# The schema is created by the database container's init scripts, not by Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Registry address: Compose sets EUREKA_URL; locally the registry runs on localhost:8761
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# Register the IP address, so scaled instances get distinct addresses
eureka.instance.prefer-ip-address=true
# Short intervals for local development and the demo (Eureka defaults: 30 s)
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

# Reject "id": 1.5 instead of silently truncating it to 1
spring.jackson.deserialization.accept-float-as-int=false
