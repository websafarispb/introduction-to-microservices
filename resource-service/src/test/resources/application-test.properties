# Integration tests run against the resource-db container from compose.yaml,
# isolated in their own schema so local development data is never touched.
spring.jpa.properties.hibernate.default_schema=resource_test
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.ddl-auto=create-drop

# No Eureka in tests: no registration and no registry lookups
eureka.client.enabled=false

spring.jpa.properties.hibernate.session_factory.statement_inspector=com.epam.learn.microservices.resourceservice.service.RecordingStatementInspector
